<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 星云盘</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-title">星云盘</div>
            <div class="auth-subtitle">登录或注册以继续使用</div>

            <div class="auth-tabs" style="display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border-light);">
                <div class="auth-tab active" style="padding:8px 4px; font-weight:600; color:var(--primary); border-bottom:2px solid var(--accent); cursor:pointer;" onclick="switchTab('login')">登录</div>
                <div class="auth-tab" style="padding:8px 4px; font-weight:600; color:var(--text-secondary); border-bottom:2px solid transparent; cursor:pointer;" onclick="switchTab('register')">注册</div>
            </div>

            <!-- 登录表单 -->
            <div id="login-form">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-input" required>
                    </div>
                    {% if error %}
                    <div style="color:var(--danger); font-size:13px; margin-bottom:12px;">{{ error }}</div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">登录</button>
                </form>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" style="display:none;">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" name="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <input type="password" name="confirm_password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">注册</button>
                </form>
            </div>

            <div class="auth-footer">
                <a href="/">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabs = document.querySelectorAll('.auth-tab');
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].style.color = 'var(--primary)';
                tabs[0].style.borderBottomColor = 'var(--accent)';
                tabs[1].style.color = 'var(--text-secondary)';
                tabs[1].style.borderBottomColor = 'transparent';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[0].style.color = 'var(--text-secondary)';
                tabs[0].style.borderBottomColor = 'transparent';
                tabs[1].style.color = 'var(--primary)';
                tabs[1].style.borderBottomColor = 'var(--accent)';
            }
        }
    </script>
</body>
</html>
