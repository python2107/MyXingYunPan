<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 星云盘</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-title">星云盘</div>
            <div class="auth-subtitle">登录或注册以继续使用</div>

            <div class="auth-tabs" style="display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border-light);">
                <div class="auth-tab active" style="padding:8px 4px; font-weight:600; color:var(--blue-900); border-bottom:2px solid var(--blue-600); cursor:pointer;" onclick="switchTab('login')">登录</div>
                <div class="auth-tab" style="padding:8px 4px; font-weight:600; color:var(--text-secondary); border-bottom:2px solid transparent; cursor:pointer;" onclick="switchTab('register')">注册</div>
            </div>

            <!-- 登录表单 -->
            <div id="login-form">
                <div>
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" id="loginUsername" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" id="loginPassword" class="form-input">
                    </div>
                    <div id="loginError" style="color:var(--danger); font-size:13px; margin-bottom:12px; display:none;"></div>
                    <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="doLogin()">登录</button>
                </div>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" style="display:none;">
                <div>
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" id="regUsername" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" id="regEmail" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" id="regPassword" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <input type="password" id="regConfirmPassword" class="form-input">
                    </div>
                    <div id="regError" style="color:var(--danger); font-size:13px; margin-bottom:12px; display:none;"></div>
                    <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="doRegister()">注册</button>
                </div>
            </div>

            <div class="auth-footer">
                <a href="/">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        function doLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';
            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({account: username, password})
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.message || '登录失败';
                    errorEl.style.display = 'block';
                }
            });
        }
        function doRegister() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorEl = document.getElementById('regError');
            errorEl.style.display = 'none';
            if (password !== confirmPassword) {
                errorEl.textContent = '两次密码不一致';
                errorEl.style.display = 'block';
                return;
            }
            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, email, password})
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    alert('注册成功，请登录');
                    switchTab('login');
                } else {
                    errorEl.textContent = data.message || '注册失败';
                    errorEl.style.display = 'block';
                }
            });
        }
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabs = document.querySelectorAll('.auth-tab');
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].style.color = 'var(--blue-900)';
                tabs[0].style.borderBottomColor = 'var(--blue-600)';
                tabs[1].style.color = 'var(--text-secondary)';
                tabs[1].style.borderBottomColor = 'transparent';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[0].style.color = 'var(--text-secondary)';
                tabs[0].style.borderBottomColor = 'transparent';
                tabs[1].style.color = 'var(--blue-900)';
                tabs[1].style.borderBottomColor = 'var(--blue-600)';
            }
        }
    </script>
</body>
</html>
