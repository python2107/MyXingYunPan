<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 星云盘</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <style>
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
        .auth-tab { padding: 8px 4px; font-weight: 600; color: var(--text-2); border-bottom: 2px solid transparent; cursor: pointer; font-size: 15px; }
        .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; display: none; }
        .code-row { display: flex; gap: 8px; }
        .code-row .form-input { flex: 1; }
        .code-row .btn { white-space: nowrap; padding: 0 16px; font-size: 13px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .terms-group { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 12px; }
        .terms-label { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; cursor: pointer; }
        .terms-label input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
        .terms-label a { color: var(--accent); }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-title">星云盘</div>
            <div class="auth-subtitle">登录或注册以继续使用</div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">登录</div>
                <div class="auth-tab" onclick="switchTab('register')">注册</div>
            </div>

            <!-- 登录表单 -->
            <div id="login-form">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" id="loginUsername" class="form-input" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码" onkeypress="if(event.key==='Enter')doLogin()">
                </div>
                <div id="loginError" class="error-msg"></div>
                <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" style="display:none;">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" id="regUsername" class="form-input" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" id="regEmail" class="form-input" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱验证码</label>
                    <div class="code-row">
                        <input type="text" id="regCode" class="form-input" placeholder="请输入验证码">
                        <button type="button" class="btn btn-outline" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" id="regPassword" class="form-input" placeholder="请输入密码（至少6位）">
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" id="regConfirmPassword" class="form-input" placeholder="请再次输入密码">
                </div>
                <div class="form-group">
                    <label class="form-label">人机验证</label>
                    <div class="code-row">
                        <input type="text" id="regCaptcha" class="form-input" placeholder="计算结果">
                        <span id="captchaQuestion" class="btn btn-outline" style="display:flex;align-items:center;padding:0 16px;font-size:14px;">加载中...</span>
                        <button type="button" class="btn btn-outline" onclick="refreshCaptcha()" style="padding:0 12px;font-size:13px;">换一题</button>
                    </div>
                </div>
                <div class="form-group terms-group">
                    <label class="terms-label">
                        <input type="checkbox" id="regAgreeTerms">
                        <span>我已阅读并同意 <a href="/terms" target="_blank">《用户协议》</a></span>
                    </label>
                    <label class="terms-label">
                        <input type="checkbox" id="regAgreePrivacy">
                        <span>我已阅读并同意 <a href="/privacy" target="_blank">《隐私政策》</a></span>
                    </label>
                </div>
                <div id="regError" class="error-msg"></div>
                <button class="btn btn-primary btn-block" onclick="doRegister()">注册</button>
            </div>

            <div class="auth-footer">
                <a href="/">返回首页</a>
            </div>
        </div>
    </div>

<script>
let codeCountdown = 0;
let codeTimer = null;

function refreshCaptcha() {
    const q = document.getElementById('captchaQuestion');
    q.textContent = '加载中...';
    fetch('/api/captcha').then(r => r.json()).then(data => {
        if (data.success) {
            q.textContent = data.question;
        }
    }).catch(() => {
        q.textContent = '加载失败，点击重试';
    });
}

// 页面加载时获取人机验证题目
refreshCaptcha();

function doLogin() {
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';
    if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.style.display = 'block';
        return;
    }
    fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({account: username, password})
    }).then(r => r.json()).then(data => {
        if (data.success) {
            window.location.href = '/dashboard';
        } else {
            errorEl.textContent = data.message || data.error || '登录失败';
            errorEl.style.display = 'block';
        }
    }).catch(() => {
        errorEl.textContent = '网络错误，请重试';
        errorEl.style.display = 'block';
    });
}

function sendCode() {
    const email = document.getElementById('regEmail').value.trim();
    const errorEl = document.getElementById('regError');
    errorEl.style.display = 'none';
    if (!email) {
        errorEl.textContent = '请先输入邮箱';
        errorEl.style.display = 'block';
        return;
    }
    const btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    fetch('/api/send_code', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
    }).then(r => r.json()).then(data => {
        if (data.success) {
            codeCountdown = 60;
            btn.textContent = codeCountdown + 's后重发';
            codeTimer = setInterval(() => {
                codeCountdown--;
                if (codeCountdown <= 0) {
                    clearInterval(codeTimer);
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                } else {
                    btn.textContent = codeCountdown + 's后重发';
                }
            }, 1000);
            errorEl.style.color = 'var(--accent)';
            errorEl.textContent = data.message || '验证码已发送';
            errorEl.style.display = 'block';
        } else {
            btn.disabled = false;
            errorEl.style.color = '#ff6b6b';
            errorEl.textContent = data.error || '发送失败';
            errorEl.style.display = 'block';
        }
    }).catch(() => {
        btn.disabled = false;
        errorEl.style.color = '#ff6b6b';
        errorEl.textContent = '网络错误，请重试';
        errorEl.style.display = 'block';
    });
}

function doRegister() {
    const username = document.getElementById('regUsername').value;
    const email = document.getElementById('regEmail').value;
    const code = document.getElementById('regCode').value;
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    const captcha = document.getElementById('regCaptcha').value;
    const agreeTerms = document.getElementById('regAgreeTerms').checked;
    const agreePrivacy = document.getElementById('regAgreePrivacy').checked;
    const errorEl = document.getElementById('regError');
    errorEl.style.color = '#ff6b6b';
    errorEl.style.display = 'none';
    if (!username || !email || !code || !password || !captcha) {
        errorEl.textContent = '请填写所有字段';
        errorEl.style.display = 'block';
        return;
    }
    if (password.length < 6) {
        errorEl.textContent = '密码至少6位';
        errorEl.style.display = 'block';
        return;
    }
    if (password !== confirmPassword) {
        errorEl.textContent = '两次密码不一致';
        errorEl.style.display = 'block';
        return;
    }
    if (!agreeTerms || !agreePrivacy) {
        errorEl.textContent = '请阅读并同意用户协议和隐私政策';
        errorEl.style.display = 'block';
        return;
    }
    fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, email, code, password, captcha, agree_terms: agreeTerms, agree_privacy: agreePrivacy})
    }).then(r => r.json()).then(data => {
        if (data.success) {
            alert('注册成功，请登录');
            switchTab('login');
            document.getElementById('loginUsername').value = username;
        } else {
            errorEl.textContent = data.error || data.message || '注册失败';
            errorEl.style.display = 'block';
            if ((data.error || '').indexOf('人机验证') >= 0) {
                refreshCaptcha();
            }
        }
    }).catch(() => {
        errorEl.textContent = '网络错误，请重试';
        errorEl.style.display = 'block';
    });
}

function switchTab(tab) {
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const tabs = document.querySelectorAll('.auth-tab');
    if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
    }
}
</script>
</body>
</html>
