<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>文件管理 · 星云盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <style>
        .toast-msg { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(20,20,30,0.92); color: #F0F0F5; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 2000; pointer-events: none; }
        .folder-name { cursor: pointer; padding: 6px 8px; border-radius: 6px; color: #F0F0F5; font-size: 14px; }
        .folder-name:hover { background: rgba(240,240,245,0.08); }
        .file-info { flex: 1; }
        .file-info strong { color: #F0F0F5; font-size: 14px; }
        .file-info small { color: #C2C2C2; font-size: 12px; }
        .new-folder-form { display: none; gap: 8px; margin-top: 8px; }
        .new-folder-form input { flex: 1; padding: 8px 12px; background: rgba(240,240,245,0.06); border: 1px solid rgba(240,240,245,0.2); border-radius: 8px; color: #F0F0F5; font-size: 13px; }
        .new-folder-form input:focus { outline: none; border-color: #8BADFD; }
        .upload-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: #C2C2C2; }
        .upload-row input[type="checkbox"] { accent-color: #8BADFD; }
    </style>
</head>
<body>
    {% include '_nav.html' %}

    <div id="toastMsg" class="toast-msg"></div>

    <div class="dashboard-container">
        <!-- 顶部：存储统计 + 快捷操作 -->
        <div class="dashboard-top">
            <div class="storage-card">
                <h3><i class="fas fa-database"></i> 存储空间</h3>
                <div class="storage-bar"><div class="storage-bar-fill" id="storageBar" style="width:0%"></div></div>
                <div class="storage-info">
                    <span id="storageUsed">0 MB</span>
                    <span id="storageTotal">总容量 2 GB</span>
                </div>
                <div class="storage-info" style="margin-top:6px;">
                    <span>文件数：<span id="fileCount">0</span></span>
                    <span><a href="/user_center" style="color:#8BADFD;">兑换容量 →</a></span>
                </div>
            </div>
            <div class="quick-actions">
                <h3><i class="fas fa-bolt"></i> 快捷操作</h3>
                <button id="uploadBtn" class="btn btn-primary btn-block"><i class="fas fa-upload"></i> 上传文件</button>
                <input type="file" id="fileInput" multiple style="display:none">
                <div class="upload-row">
                    <label><input type="checkbox" id="uploadPublicCheckbox"> 设为公开文件</label>
                </div>
                <button id="newFolderBtn" class="btn btn-outline btn-block"><i class="fas fa-folder-plus"></i> 新建文件夹</button>
                <div class="new-folder-form" id="newFolderInputGroup">
                    <input type="text" id="newFolderName" placeholder="文件夹名称">
                    <button id="confirmNewFolder" class="btn btn-primary btn-sm">创建</button>
                    <button id="cancelNewFolder" class="btn btn-outline btn-sm">取消</button>
                </div>
            </div>
        </div>

        <!-- 文件夹树 -->
        <div class="file-section">
            <h3><i class="fas fa-folder-tree"></i> 文件夹</h3>
            <div id="folderTreeContainer"><p style="color:#C2C2C2;font-size:13px;">加载中...</p></div>
        </div>

        <!-- 文件列表 -->
        <div class="file-section">
            <h3 id="currentFolderTitle"><i class="fas fa-folder-open"></i> 当前：根目录</h3>
            <div id="fileListContainer" class="file-list">
                <p style="color:#C2C2C2;font-size:13px;padding:8px;">加载中...</p>
            </div>
        </div>
    </div>

<script>
    let currentFolderId = null;
    let folderTreeData = [];
    let currentUser = null;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2800);
    }

    async function getUserInfo() {
        try {
            const res = await fetch('/api/user/info');
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                if (data.user.storage_used !== undefined) {
                    const usedMB = (data.user.storage_used / 1024 / 1024).toFixed(1);
                    const totalGB = data.user.storage_total ? (data.user.storage_total / 1024 / 1024 / 1024).toFixed(1) : '2';
                    document.getElementById('storageUsed').textContent = usedMB + ' MB 已用';
                    document.getElementById('storageTotal').textContent = '总容量 ' + totalGB + ' GB';
                    const pct = Math.min(100, (data.user.storage_used / (data.user.storage_total || 2*1024*1024*1024)) * 100);
                    document.getElementById('storageBar').style.width = pct + '%';
                }
            }
        } catch(e) {}
    }

    async function loadFolderTree() {
        const res = await fetch('/api/folders');
        const data = await res.json();
        if (data.success) {
            folderTreeData = data.folders;
            renderFolderTree(folderTreeData, 0);
        } else {
            document.getElementById('folderTreeContainer').innerHTML = '<p style="color:#C2C2C2;font-size:13px;">暂无文件夹</p>';
        }
    }

    function renderFolderTree(nodes, level) {
        if (!nodes || !nodes.length) {
            document.getElementById('folderTreeContainer').innerHTML = '<p style="color:#C2C2C2;font-size:13px;">暂无文件夹</p>';
            return;
        }
        let html = '<ul style="list-style:none; padding-left:0;">';
        for (let node of nodes) {
            html += `<li style="margin-left: ${level * 16}px;">
                        <div class="folder-name" onclick="selectFolder(${node.id}, '${escapeHtml(node.name)}')">
                            <i class="fas fa-folder" style="color:#8BADFD;"></i> ${escapeHtml(node.name)}
                        </div>
                        <div style="padding-left:24px;margin-top:2px;">
                            <button onclick="deleteFolder(${node.id})" class="btn btn-danger btn-sm" style="padding:2px 10px;min-height:24px;font-size:12px;">删除</button>
                        </div>
                    </li>`;
            if (node.children && node.children.length) {
                html += renderFolderTree(node.children, level + 1);
            }
        }
        html += '</ul>';
        document.getElementById('folderTreeContainer').innerHTML = html;
    }

    window.selectFolder = async function(folderId, folderName) {
        currentFolderId = folderId;
        document.getElementById('currentFolderTitle').innerHTML = `<i class="fas fa-folder-open"></i> 当前：${escapeHtml(folderName)}`;
        await loadFiles(currentFolderId);
    };

    async function loadFiles(folderId = null) {
        let url = '/api/files';
        if (folderId) url += `?folder_id=${folderId}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.success) {
            renderFileList(data.files);
            document.getElementById('fileCount').textContent = data.files ? data.files.length : 0;
        } else {
            document.getElementById('fileListContainer').innerHTML = '<p style="color:#C2C2C2;font-size:13px;padding:8px;">暂无文件</p>';
        }
    }

    function renderFileList(files) {
        if (!files || !files.length) {
            document.getElementById('fileListContainer').innerHTML = '<p style="color:#C2C2C2;font-size:13px;padding:8px;">暂无文件</p>';
            return;
        }
        let html = '';
        for (let f of files) {
            const icon = f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i) ? 'fa-image' :
                         f.name.match(/\.(mp4|avi|mov)$/i) ? 'fa-video' :
                         f.name.match(/\.(mp3|wav|ogg)$/i) ? 'fa-music' :
                         f.name.match(/\.(pdf|doc|docx|txt)$/i) ? 'fa-file-alt' : 'fa-file';
            html += `
                <div class="file-item">
                    <div class="file-icon"><i class="fas ${icon}"></i></div>
                    <div class="file-info">
                        <strong>${escapeHtml(f.name)}</strong><br>
                        <small>${f.size_human || ''} · ${f.is_public ? '公开' : '私密'} · 👍 ${f.likes || 0} · ⭐ ${f.collections || 0}</small>
                    </div>
                    <div class="file-actions">
                        <button onclick="togglePublic(${f.id}, ${f.is_public})" class="btn btn-primary btn-sm">${f.is_public ? '设为私密' : '设为公开'}</button>
                        <button onclick="downloadFile(${f.id})" class="btn btn-outline btn-sm"><i class="fas fa-download"></i> 下载</button>
                        <button onclick="copyShareLink(${f.id})" class="btn btn-outline btn-sm"><i class="fas fa-share-alt"></i></button>
                        <button onclick="moveFile(${f.id})" class="btn btn-outline btn-sm"><i class="fas fa-exchange-alt"></i></button>
                        <button onclick="deleteFile(${f.id})" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        }
        document.getElementById('fileListContainer').innerHTML = html;
    }

    window.downloadFile = function(fileId) {
        window.open('/download/' + fileId, '_blank');
    };

    window.togglePublic = async (fileId, currentStatus) => {
        const res = await fetch(`/api/file/toggle_public/${fileId}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            showToast(`已${data.is_public ? '公开' : '私密'}`);
            await loadFiles(currentFolderId);
        } else {
            showToast(data.error || '操作失败', true);
        }
    };

    window.copyShareLink = (fileId) => {
        const link = `${window.location.origin}/numfile/${fileId}`;
        navigator.clipboard.writeText(link).then(() => showToast('分享链接已复制')).catch(() => showToast('链接: ' + link));
    };

    window.deleteFile = async (fileId) => {
        if (!confirm('确定删除此文件？')) return;
        const res = await fetch(`/api/delete/${fileId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            showToast('删除成功');
            await loadFiles(currentFolderId);
        } else {
            showToast(data.error || '删除失败', true);
        }
    };

    window.moveFile = async (fileId) => {
        const targetFolderId = prompt('请输入目标文件夹ID（0表示根目录）:', currentFolderId || '0');
        if (targetFolderId === null) return;
        const folderId = targetFolderId === '0' ? null : parseInt(targetFolderId);
        const res = await fetch('/api/files/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_id: fileId, folder_id: folderId })
        });
        const data = await res.json();
        if (data.success) {
            showToast('移动成功');
            await loadFiles(currentFolderId);
        } else {
            showToast(data.error || '移动失败', true);
        }
    };

    window.deleteFolder = async (folderId) => {
        if (!confirm('删除文件夹将同时删除其内所有文件和子文件夹，不可恢复！确定吗？')) return;
        const res = await fetch(`/api/folders/${folderId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            showToast('删除成功');
            if (currentFolderId === folderId) {
                currentFolderId = null;
                document.getElementById('currentFolderTitle').innerHTML = `<i class="fas fa-folder-open"></i> 当前：根目录`;
                await loadFiles(null);
            }
            await loadFolderTree();
        } else {
            showToast(data.error || '删除失败', true);
        }
    };

    document.getElementById('newFolderBtn').addEventListener('click', () => {
        document.getElementById('newFolderInputGroup').style.display = 'flex';
    });
    document.getElementById('cancelNewFolder').addEventListener('click', () => {
        document.getElementById('newFolderInputGroup').style.display = 'none';
        document.getElementById('newFolderName').value = '';
    });
    document.getElementById('confirmNewFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        if (!name) { showToast('请输入文件夹名称', true); return; }
        const res = await fetch('/api/folders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, parent_id: currentFolderId })
        });
        const data = await res.json();
        if (data.success) {
            showToast('文件夹创建成功');
            document.getElementById('newFolderName').value = '';
            document.getElementById('newFolderInputGroup').style.display = 'none';
            await loadFolderTree();
        } else {
            showToast(data.error || '创建失败', true);
        }
    });

    document.getElementById('uploadBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = e.target.files;
        if (!files.length) return;
        const isPublic = document.getElementById('uploadPublicCheckbox').checked ? 1 : 0;
        for (let file of files) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('is_public', isPublic);
            if (currentFolderId) formData.append('folder_id', currentFolderId);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    showToast(`上传成功：${file.name}`);
                } else {
                    showToast(data.error || '上传失败', true);
                }
            } catch (err) {
                showToast('上传失败', true);
            }
        }
        await loadFiles(currentFolderId);
        await getUserInfo();
        document.getElementById('fileInput').value = '';
    });

    async function init() {
        await getUserInfo();
        await loadFolderTree();
        await loadFiles(currentFolderId);
    }
    init();

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
