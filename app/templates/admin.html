<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员控制台 · 星云盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>
<body>
    {% include '_nav.html' %}

<div class="container">
    <div id="toastMsg" class="toast-msg"></div>

    <div class="admin-header">
        <h1><i class="fas fa-shield-halved"></i> 管理员控制台</h1>
        <p>欢迎，<span id="adminName">加载中...</span></p>
    </div>

    <div class="admin-tabs" style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
        <button class="btn btn-primary admin-tab-btn" data-tab="users">用户管理</button>
        <button class="btn btn-outline admin-tab-btn" data-tab="homepage">主页设置</button>
        <button class="btn btn-outline admin-tab-btn" data-tab="codes">注册验证码</button>
    </div>

    <!-- 用户管理 -->
    <div class="admin-tab-panel" id="tab-users">
    <div class="admin-table-wrap">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>星币</th>
                    <th>存储(MB)</th>
                    <th>注册时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="7">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    </div>

    <!-- 主页设置 -->
    <div class="admin-tab-panel" id="tab-homepage" style="display:none;">
        <div style="max-width:640px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;">
            <h3 style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;">主页最大文字设置</h3>
            <p style="font-size:13px;color:var(--text-2);margin-bottom:16px;">修改后主页（首页）最大的标题文字立即生效，无需登录 PythonAnywhere。支持使用 \n 换行。</p>
            <textarea id="siteTitleInput" class="form-input" rows="3" style="width:100%;margin-bottom:12px;" placeholder="输入主页大标题，例如：你的私有云盘\n分享与社交"></textarea>
            <button id="saveSiteTitleBtn" class="btn btn-primary">保存并生效</button>
        </div>
    </div>

    <!-- 注册验证码 -->
    <div class="admin-tab-panel" id="tab-codes" style="display:none;">
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>邮箱</th>
                        <th>验证码</th>
                        <th>状态</th>
                        <th>发送时间</th>
                    </tr>
                </thead>
                <tbody id="codesTableBody">
                    <tr><td colspan="5">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 文件查看模态框 -->
<div id="filesModal" class="chat-modal" style="display:none;">
    <div class="chat-modal-content">
        <div class="chat-modal-header">
            <span id="filesModalTitle">用户文件</span>
            <button id="closeFilesModalBtn" class="btn btn-outline" style="padding:4px 12px;font-size:14px;">关闭</button>
        </div>
        <div id="filesList" class="chat-messages"></div>
    </div>
</div>

<script>
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? 'rgba(20,20,30,0.9)' : 'rgba(20,20,30,0.9)';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2800);
    }

    async function fetchAdminInfo() {
        const res = await fetch('/api/check_auth');
        const data = await res.json();
        if (!data.success || !data.user.is_admin) {
            window.location.href = '/login';
        } else {
            document.getElementById('adminName').innerText = data.user.username;
        }
    }

    async function loadUsers() {
        try {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if (data.success) {
                renderUsers(data.users);
            } else {
                showToast(data.error, true);
            }
        } catch (err) {
            showToast('加载用户列表失败', true);
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('usersTableBody');
        if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="7">暂无用户</td></tr>';
            return;
        }
        let html = '';
        for (let u of users) {
            const isAdmin = u.is_admin;
            html += `
                <tr>
                    <td>${u.id}</td>
                    <td>${escapeHtml(u.username)}${isAdmin ? ' <span style="color:#C2C2C2;">(管理员)</span>' : ''}</td>
                    <td>${u.email ? escapeHtml(u.email) : '-'}</td>
                    <td>${u.coins}</td>
                    <td>${u.capacity_used_mb}/${u.capacity_total_mb}</td>
                    <td>${new Date(u.created_at).toLocaleString()}</td>
                    <td class="user-actions">
                        ${!isAdmin ? `
                            <button class="view-files-btn" data-user-id="${u.id}" data-username="${escapeHtml(u.username)}">查看文件</button>
                            <button class="adjust-coins-btn" data-user-id="${u.id}" data-username="${escapeHtml(u.username)}">调整星币</button>
                            <button class="reset-pwd-btn" data-user-id="${u.id}" data-username="${escapeHtml(u.username)}">重置密码</button>
                            <button class="delete-user-btn danger-btn" data-user-id="${u.id}" data-username="${escapeHtml(u.username)}">删除用户</button>
                        ` : '<span>管理员操作受限</span>'}
                    </td>
                </tr>
            `;
        }
        tbody.innerHTML = html;

        document.querySelectorAll('.view-files-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const userId = btn.getAttribute('data-user-id');
                const username = btn.getAttribute('data-username');
                viewUserFiles(userId, username);
            });
        });
        document.querySelectorAll('.adjust-coins-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const userId = btn.getAttribute('data-user-id');
                const username = btn.getAttribute('data-username');
                adjustCoins(userId, username);
            });
        });
        document.querySelectorAll('.reset-pwd-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const userId = btn.getAttribute('data-user-id');
                const username = btn.getAttribute('data-username');
                resetPassword(userId, username);
            });
        });
        document.querySelectorAll('.delete-user-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const userId = btn.getAttribute('data-user-id');
                const username = btn.getAttribute('data-username');
                deleteUser(userId, username);
            });
        });
    }

    async function viewUserFiles(userId, username) {
        document.getElementById('filesModalTitle').innerText = `${username} 的文件`;
        document.getElementById('filesModal').style.display = 'flex';
        document.getElementById('filesList').innerHTML = '加载中...';
        try {
            const res = await fetch(`/api/admin/user/${userId}/files`);
            const data = await res.json();
            if (data.success) {
                if (data.files.length === 0) {
                    document.getElementById('filesList').innerHTML = '<p>该用户暂无文件</p>';
                } else {
                    let html = '';
                    for (let f of data.files) {
                        html += `
                            <div class="file-item">
                                <span><i class="fas fa-file"></i> ${escapeHtml(f.name)} (${f.size_human})</span>
                                <a href="${f.download_url}" target="_blank" class="btn btn-outline" style="padding:2px 8px;">下载</a>
                            </div>
                        `;
                    }
                    document.getElementById('filesList').innerHTML = html;
                }
            } else {
                document.getElementById('filesList').innerHTML = `<p>加载失败: ${data.error}</p>`;
            }
        } catch (err) {
            document.getElementById('filesList').innerHTML = '<p>加载失败</p>';
        }
    }

    async function adjustCoins(userId, username) {
        const delta = prompt(`为 ${username} 调整星币数量（正数增加，负数减少）：`, "0");
        if (delta === null) return;
        const deltaNum = parseInt(delta);
        if (isNaN(deltaNum) || deltaNum === 0) {
            showToast('请输入非零整数', true);
            return;
        }
        const reason = prompt("调整原因（可选）：", "管理员调整") || "管理员调整";
        try {
            const res = await fetch(`/api/admin/adjust_coins/${userId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ delta: deltaNum, reason })
            });
            const data = await res.json();
            if (data.success) {
                showToast(`调整成功，新余额: ${data.new_balance}`);
                loadUsers();
            } else {
                showToast(data.error, true);
            }
        } catch (err) {
            showToast('请求失败', true);
        }
    }

    async function resetPassword(userId, username) {
        const newPwd = prompt(`重置 ${username} 的密码（至少6位）:`, "123456");
        if (!newPwd) return;
        if (newPwd.length < 6) {
            showToast('密码至少6位', true);
            return;
        }
        try {
            const res = await fetch(`/api/admin/reset_password/${userId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_password: newPwd })
            });
            const data = await res.json();
            if (data.success) {
                showToast(`密码已重置为 ${newPwd}`);
            } else {
                showToast(data.error, true);
            }
        } catch (err) {
            showToast('请求失败', true);
        }
    }

    async function deleteUser(userId, username) {
        if (!confirm(`确定永久删除用户 ${username} 及其所有文件吗？不可恢复！`)) return;
        try {
            const res = await fetch(`/api/admin/delete_user/${userId}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                showToast('用户已删除');
                loadUsers();
            } else {
                showToast(data.error, true);
            }
        } catch (err) {
            showToast('删除失败', true);
        }
    }

    document.getElementById('closeFilesModalBtn').addEventListener('click', () => {
        document.getElementById('filesModal').style.display = 'none';
    });
    window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('filesModal')) {
            document.getElementById('filesModal').style.display = 'none';
        }
    });

    // ===== 主页设置 =====
    async function loadSiteTitle() {
        try {
            const res = await fetch('/api/admin/settings');
            const data = await res.json();
            if (data.success) {
                document.getElementById('siteTitleInput').value = data.site_title.replace(/<br>/g, '\n');
            }
        } catch (err) {
            showToast('读取主页标题失败', true);
        }
    }

    document.getElementById('saveSiteTitleBtn').addEventListener('click', async () => {
        const val = document.getElementById('siteTitleInput').value.trim();
        if (!val) {
            showToast('标题不能为空', true);
            return;
        }
        try {
            const res = await fetch('/api/admin/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ site_title: val })
            });
            const data = await res.json();
            if (data.success) {
                showToast('主页标题已更新');
            } else {
                showToast(data.error, true);
            }
        } catch (err) {
            showToast('保存失败', true);
        }
    });

    // ===== 注册验证码 =====
    async function loadCodes() {
        const tbody = document.getElementById('codesTableBody');
        tbody.innerHTML = '<tr><td colspan="5">加载中...</td></tr>';
        try {
            const res = await fetch('/api/admin/verification_codes?limit=50');
            const data = await res.json();
            if (!data.success) {
                tbody.innerHTML = `<tr><td colspan="5">加载失败: ${data.error}</td></tr>`;
                return;
            }
            if (!data.codes.length) {
                tbody.innerHTML = '<tr><td colspan="5">暂无验证码记录</td></tr>';
                return;
            }
            let html = '';
            for (let c of data.codes) {
                const usedTxt = c.used ? '已使用' : '未使用';
                html += `<tr>
                    <td>${c.id}</td>
                    <td>${escapeHtml(c.email)}</td>
                    <td><strong style="letter-spacing:2px;">${escapeHtml(c.code)}</strong></td>
                    <td>${usedTxt}</td>
                    <td>${c.created_at}</td>
                </tr>`;
            }
            tbody.innerHTML = html;
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">加载失败</td></tr>';
        }
    }

    // ===== Tab 切换 =====
    document.querySelectorAll('.admin-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-tab');
            document.querySelectorAll('.admin-tab-btn').forEach(b => {
                if (b === btn) {
                    b.classList.remove('btn-outline');
                    b.classList.add('btn-primary');
                } else {
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-outline');
                }
            });
            document.querySelectorAll('.admin-tab-panel').forEach(p => p.style.display = 'none');
            document.getElementById('tab-' + tab).style.display = '';
            if (tab === 'homepage') loadSiteTitle();
            if (tab === 'codes') loadCodes();
        });
    });

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function init() {
        await fetchAdminInfo();
        await loadUsers();
    }
    init();
</script>
</body>
</html>
