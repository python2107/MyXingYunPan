<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好友对话 · 星云盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>
<body>
    {% include '_nav.html' %}
    <div class="chat-layout">
        <div class="chat-sidebar">
            <div class="chat-sidebar-header">
                <h3><i class="fas fa-users"></i> 好友列表</h3>
                <input type="text" class="chat-search" placeholder="搜索好友..." id="friendSearch">
            </div>
            <div id="friendList" class="friend-list">
                <div class="msg-empty" style="padding:20px;">加载中...</div>
            </div>
        </div>
        <div class="chat-main">
            <div class="chat-header">
                <div class="friend-avatar" id="chatAvatar" style="width:36px;height:36px;font-size:13px;">?</div>
                <div>
                    <div class="chat-header-name" id="chatHeader">选择好友开始对话</div>
                    <div class="chat-header-status">从左侧选择好友开始聊天</div>
                </div>
            </div>
            <div id="chatMessages" class="chat-messages">
                <div class="msg-empty">
                    <i class="fas fa-comments" style="font-size:32px;margin-bottom:12px;opacity:0.4;"></i><br>
                    从左侧选择好友开始聊天
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="输入消息..." disabled onkeypress="if(event.key==='Enter')document.getElementById('sendBtn').click()">
                <button class="chat-send" id="fileBtn" disabled title="发送云盘文件" style="margin-right:6px;">文件</button>
                <button class="chat-send" id="sendBtn" disabled>发送</button>
            </div>
        </div>
    </div>

    <!-- 发送文件选择弹窗 -->
    <div id="fileModal" class="chat-modal" style="display:none;">
        <div class="chat-modal-content">
            <div class="chat-modal-header">
                <span>发送云盘文件</span>
                <button id="closeFileModalBtn" class="btn btn-outline" style="padding:4px 12px;font-size:14px;">关闭</button>
            </div>
            <div style="padding:12px 16px;overflow-y:auto;max-height:60vh;">
                <h4 style="font-size:14px;color:var(--text);margin-bottom:8px;">我的文件</h4>
                <div id="mineFileList" class="friend-list" style="max-height:180px;"></div>
                <h4 style="font-size:14px;color:var(--text);margin:14px 0 8px;">别人的公开文件</h4>
                <div id="publicFileList" class="friend-list" style="max-height:180px;"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
